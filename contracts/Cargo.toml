[workspace]
members = ["items", "market"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kaustubh76/NearCraft"

[workspace.dependencies]
near-sdk = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
