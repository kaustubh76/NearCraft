# Everything here runs with only Rust and Node — no NEAR account, no faucet, no
# credentials. The sandbox suite is deliberately a separate job because it needs
# cargo-near to compile the wasm first, and it should not be able to make the
# fast checks look broken.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: unit tests, policy tests, baseline hashes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      # 90 Rust unit tests + 82 offline Node tests + the 11 baseline hashes.
      - run: npm test

  sandbox:
    name: sandbox integration (real local NEAR node)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - run: npm ci --no-audit --no-fund
      - run: cargo install cargo-near --locked
      - run: npm run build:contracts
      # Conformance is read off the ABI cargo-near just emitted.
      - run: npm run check:nep245
      # near-workspaces downloads a nearcore sandbox binary on first run.
      - run: npm run test:sandbox
